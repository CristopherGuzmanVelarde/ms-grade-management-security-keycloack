spring:
  application:
    name: vg-ms-grade-management
  data:
    mongodb:
      uri: mongodb+srv://cristopherguzman:orTIWL10NmFAo3S5@cluster0.o8sc9.mongodb.net/AS231S5_PRS2?retryWrites=true&w=majority&appName=Cluster0
      database: AS231S5_PRS2
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-single-value-as-array: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Configuración local de Keycloak para desarrollo
          issuer-uri: http://localhost:8080/realms/grade-management
          # Alternative configuration
          # jwk-set-uri: http://localhost:8080/realms/grade-management/protocol/openid-connect/certs

# Configuración del servidor para desarrollo
server:
  port: 8081

# Logging para desarrollo (más verbose)
logging:
  level:
    "[org.springframework.security]": DEBUG
    "[org.springframework.security.oauth2]": DEBUG
    "[pe.edu.vallegrande.vg_ms_grade_management]": DEBUG

students:
  service:
    url: https://ms.students.machashop.top

# Configuración de seguridad personalizada
app:
  security:
    jwt:
      # Roles permitidos en el microservicio
      allowed-roles:
        - ADMIN
        - TEACHER
        - STUDENT
      # Endpoints públicos (sin autenticación)
      public-endpoints:
        - /actuator/health
        - /api/v1/public/**
